name: PR Checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r server/requirements.txt
      - run: python -m compileall server auto.py auto_old.py
